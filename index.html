<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="فتّشها" />
    <meta name="theme-color" content="#020c18" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>فتّشها - نتحداك في كل كلمة</title>
    <meta name="description" content="لعبة الكلمات والشبكات العربية التفاعلية بهوية كويتية شبابية، تدعم اللعب الفردي، والمحلي، والأونلاين الفوري، ووضع Android TV." />
    <meta property="og:title" content="فتّشها - نتحداك في كل كلمة" />
    <meta property="og:description" content="لعبة الكلمات والشبكات العربية التفاعلية بهوية كويتية شبابية، تدعم اللعب الفردي، والمحلي، والأونلاين الفوري، ووضع Android TV." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#020c18] text-slate-100 font-sans antialiased selection:bg-teal-500 selection:text-white overflow-x-hidden min-h-dvh w-full">
    <div id="root" class="min-h-dvh w-full flex flex-col"></div>
    <script>
      try {
        var proto = window.location && window.location.protocol;
        var host = (window.location && window.location.hostname ? window.location.hostname : '').toLowerCase();
        var isNativeShell = proto === 'capacitor:' || proto === 'ionic:' || proto === 'file:';
        var isStaticHost = host.endsWith('.vercel.app') || host.endsWith('.netlify.app');
        var storedApi = localStorage.getItem('fatteshha_api_base_url') || '';
        if (isNativeShell || isStaticHost) {
          if (!storedApi || /ais-(?:dev|pre)-/i.test(storedApi)) {
            localStorage.setItem('fatteshha_api_base_url', 'https://ftsh.onrender.com');
          }
        } else {
          if (storedApi.indexOf('onrender.com') !== -1) {
            localStorage.removeItem('fatteshha_api_base_url');
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
